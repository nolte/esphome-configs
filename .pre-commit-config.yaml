repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
        args: ['--markdown-linebreak-ext=md']
    # The primary artefact of this repository is ~60 YAML files, none of
    # which were syntax-checked before commit. ESPHome's !include / !env_var
    # tags and the `<<:` merge fragments are not standard YAML, so the
    # archived .snipped fragments and the poc tree are excluded; `esphome
    # config` covers the live device files in CI.
    # --unsafe: syntax-only. ESPHome's !include / !env_var / !extend tags and
    # the `<<:` merge fragments are not resolvable by a plain YAML loader;
    # semantic validation is `esphome config` in CI.
    -   id: check-yaml
        args: ['--unsafe', '--allow-multiple-documents']
