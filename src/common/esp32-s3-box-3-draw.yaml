substitutions:
  name: ${name}
  friendly_name: ${name}

  # Casita Illustrationen
  loading_illustration_file:  https://github.com/esphome/wake-word-voice-assistants/raw/main/casita/loading_320_240.png
  idle_illustration_file:     https://github.com/esphome/wake-word-voice-assistants/raw/main/casita/idle_320_240.png
  listening_illustration_file: https://github.com/esphome/wake-word-voice-assistants/raw/main/casita/listening_320_240.png
  thinking_illustration_file:  https://github.com/esphome/wake-word-voice-assistants/raw/main/casita/thinking_320_240.png
  replying_illustration_file:  https://github.com/esphome/wake-word-voice-assistants/raw/main/casita/replying_320_240.png
  error_illustration_file:     https://github.com/esphome/wake-word-voice-assistants/raw/main/casita/error_320_240.png
  timer_finished_illustration_file: https://github.com/esphome/wake-word-voice-assistants/raw/main/casita/timer_finished_320_240.png

  # Hintergrundfarben je Phase
  loading_illustration_background_color: "000000"
  idle_illustration_background_color:    "000000"
  listening_illustration_background_color: "FFFFFF"
  thinking_illustration_background_color:  "FFFFFF"
  replying_illustration_background_color:  "FFFFFF"
  error_illustration_background_color:     "000000"

  # Voice Assistant Phasen IDs
  voice_assist_idle_phase_id:           "1"
  voice_assist_listening_phase_id:      "2"
  voice_assist_thinking_phase_id:       "3"
  voice_assist_replying_phase_id:       "4"
  voice_assist_not_ready_phase_id:      "10"
  voice_assist_error_phase_id:          "11"
  voice_assist_muted_phase_id:          "12"
  voice_assist_timer_finished_phase_id: "20"
  voice_assist_pixel_art_phase_id:      "30"   # [NEW] Pixel Art Modus

  # Font-Konfiguration
  font_glyphsets: "GF_Latin_Core"
  font_family: Figtree

  # Erlaubte Sonderzeichen für Fonts
  allowed_characters: " !#%'()+,-./0123456789:;<>?@ABCDEFGHIJKLMNOPQRSTUVWYZ[]_abcdefghijklmnopqrstuvwxyz{|}°²³µ¿ÁÂÄÅÉÖÚßàáâãäåæçèéêëìíîðñòóôõöøùúûüýþāăąćčďĐđēėęěğĮįıļľŁłńňőřśšťũūůűųźŻżŽžơưșțΆΈΌΐΑΒΓΔΕΖΗΘΚΜΝΠΡΣΤΥΦάέήίαβγδεζηθικλμνξοπρςστυφχψωϊόύώАБВГДЕЖЗИКЛМНОПРСТУХЦЧШЪЭЮЯабвгдежзийклмнопрстуфхцчшщъыьэюяёђєіїјљњћאבגדהוזחטיכלםמןנסעפץצקרשת،ءآأإئابةتجحخدذرزسشصضطظعغفقكلمنهوىيٹپچڈکگںھہیے"

# ============================================================
#  PACKAGES
# ============================================================
packages:
  base: !include
    file: ./base.yaml
    vars:
      project_name: "diy.esp32-s3-box-3"
      project_version: "esp32-s3-box-3"
  time:       !include ./time.yaml
  pixel_art:  !include ./pixel_art.yaml   # [NEW]

# ============================================================
#  ESP32 / HARDWARE
# ============================================================
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.5.0
  name_add_mac_suffix: false
  on_boot:
    priority: 600
    then:
      - script.execute: draw_display
      - delay: 30s
      - if:
          condition:
            lambda: return id(init_in_progress);
          then:
            - lambda: id(init_in_progress) = false;
            - script.execute: draw_display

esp32:
  board: esp32s3box
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240:    "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB:        "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B:    "y"

psram:
  mode: octal
  speed: 80MHz

# ============================================================
#  CONNECTIVITY
# ============================================================
api:
  custom_services: true
  on_client_connected:
    - script.execute: draw_display
  on_client_disconnected:
    - script.execute: draw_display
  # HINWEIS: api.actions sind in den Device-YAMLs definiert
  # (esp32-s3-box-3-01.yaml / esp32-s3-box-3-02.yaml),
  # da ESPHome api: aus tief verschachtelten Packages
  # nicht zuverlässig mit base.yaml merged.

  actions:
    # ── Pixel Art anzeigen ───────────────────────────────────
    # HA Service: esphome.esp32_s3_box_3_01_set_pixel_art
    # Parameter:
    #   pixel_data (string) : 256 Hex-Zeichen (0–F)
    #   label      (string) : Beschriftung unter dem Icon
    - action: set_pixel_art
      variables:
        pixel_data: string
        label: string
      then:
        - lambda: |-
            id(pixel_art_hex) = pixel_data;
            id(pixel_art_lbl) = label;
        # Go through the switch instead of setting the phase directly. Setting
        # only the phase left the switch off, so clear_pixel_art and the home
        # button - which both only turn the switch off - never fired its
        # on_turn_off, and the mode could not be left.
        - switch.turn_on: pixel_art_mode
        # on_turn_on fires only on an actual state change; redraw explicitly
        # so new pixel data also lands while the mode is already active.
        - script.execute: draw_display

    # ── Pixel Art beenden ────────────────────────────────────
    # HA Service: esphome.esp32_s3_box_3_01_clear_pixel_art
    - action: clear_pixel_art
      then:
        - lambda: |-
            id(pixel_art_hex) = "";
            id(pixel_art_lbl) = "";
        - switch.turn_off: pixel_art_mode


ota:
  - platform: esphome
    id: ota_esphome

logger:
  hardware_uart: USB_SERIAL_JTAG

