StylesPath = ".github/styles"
MinAlertLevel = suggestion
Vocab = esphome

Packages = Microsoft, RedHat, https://github.com/nolte/vale-style/releases/download/v0.1.17/nolte-styles.zip

IgnoredScopes = code,tt, em

[*.md]
BasedOnStyles = Vale, Microsoft

# Internal working artefacts, not published prose: the requirements-elicitation
# record and the plan-before-work files are verbatim decision logs whose value
# is fidelity to what was decided, not editorial polish. Applying a style guide
# for end-user documentation to them produces only noise.
[project/requirements/*.md]
BasedOnStyles =

[.resume/**/*.md]
BasedOnStyles =
